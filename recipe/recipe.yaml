schema_version: 1

context:
  name: rpm-tools
  version: "6.0.2"
  major_minor: ${{ (version | split('.'))[:2] | join('.') }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: http://ftp.rpm.org/releases/rpm-${{ major_minor }}.x/rpm-${{ version }}.tar.bz2
  sha256: 66a4998e020d7354a804fde83801a9d7157b20f5e08198f7fde69d3a0ab683fe
  patches:
    - 0001-Remove-fhardened-from-compiler-flags.patch

build:
  number: 1
  skip: win or osx
  script:
    - mkdir build-dir
    - cd build-dir
    - cmake .. $CMAKE_ARGS -DWITH_SELINUX=OFF -DWITH_DBUS=OFF -DWITH_AUDIT=OFF
    - cmake --build . --target install -- -j$CPU_COUNT

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - make
    - cmake
    - pkg-config
    - gettext
    - scdoc
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
  host:
    - if: linux
      then:
        - python
        - elfutils
    - libarchive
    - if: linux
      then: libcap
    - libsqlite
    - lua
    - popt
    - readline
    - zstd
    - liblzma-devel
    - bzip2
    - libiconv
    - file
    - zlib
    - rpm-sequoia
    - libacl
  run:
    - if: linux
      then:
        - python
        - ${{ pin_compatible('elfutils') }}
    - ${{ pin_compatible('file') }}

tests:
  - python:
      imports:
        - rpm
  - script:
      - rpm --help

about:
  license: GPL-2.0-or-later OR LGPL-2.0-or-later
  license_file: COPYING
  summary: The RPM Package Manager
  description: |
    The RPM Package Manager (RPM) is a powerful package management system capable of:

    * building computer software from source into easily distributable packages
    * installing, updating and uninstalling packaged software
    * querying detailed information about the packaged software, whether installed or not
    * verifying integrity of packaged software and resulting software installation

  homepage: https://rpm.org/index.html
  repository: https://github.com/rpm-software-management/rpm/
  documentation: https://rpm.org/documentation.html

extra:
  recipe-maintainers:
    - chrisburr
